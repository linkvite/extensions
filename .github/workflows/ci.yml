name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # zip builds first: .output/chrome-mv3 is what the tests load
      - name: Build Chrome
        run: pnpm zip

      - name: Build Firefox
        run: pnpm zip:firefox

      - name: Build Safari
        run: pnpm build:safari

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Upload builds
        uses: actions/upload-artifact@v6
        with:
          name: linkvite-extension-${{ github.sha }}
          path: .output/*.zip
          # .output is a dot-folder, which upload-artifact skips by default
          include-hidden-files: true
          if-no-files-found: error
